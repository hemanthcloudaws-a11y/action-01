name: Generate ASCII workflow

on: push

jobs: 
    build_job:
        runs-on: ubuntu-22.04
        steps:  
        - name: Install cowsay
          run: sudo apt-get install cowsay -y

        - name: execute cowsay
          run: cowsay -f dragon "run for dragon" >> dragon.txt
          
        - name: upload dragon file
          uses: actions/upload-artifact@v7
          with:
            name: my-dragon
            path: dragon.txt
          
    test_job:
        needs: build_job
        runs-on: ubuntu-22.04
        steps:
        - name: download dragon file
          uses: actions/download-artifact@v8
          with:
            name: my-dragon
            run: ls -R
          
        - name: test file
          run: grep -i "dragon" dragon.txt

    deploy_job:
        needs: test_job
        runs-on: ubuntu-22.04
        steps:
        - name: download dragon file
          uses: actions/download-artifact@v8
          with:
            name: my-dragon    
        - name: read file
          run: cat dragon.txt            
